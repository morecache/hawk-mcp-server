openapi: 3.0.3

info:
  title: hawk-mcp
  description: |
    Cluster management API for the Hawk MCP server: read endpoints plus
    confirmed write actions.

    The "info" tool returns this metadata only; it does not read cluster
    state. For live state use cluster_get, nodes_list or resources_list.

    These endpoints are served by the hawk-apiserver `mcp-api` branch under
    /api/mcp/v1 and are authenticated with a static bearer token. They are
    JSON-only and are kept separate from the browser-facing /api/cib endpoints.

    All responses are JSON objects. Errors are returned as
    {"error":{"code":"...","message":"..."}} together with a matching HTTP
    status code (401 for a missing/invalid token; 503 cluster_unavailable when
    the cluster is stopped or still initializing; 503 token_file_unavailable or
    token_file_empty when the MCP token file is missing or empty).

    Write tools take their options as a nested requestBody object:
    {"requestBody": {"confirm": true, "dry_run": true}}. A top-level "confirm"
    is not accepted.
  version: 0.1.0

servers:
  - url: https://127.0.0.1:7630

security:
  - bearerAuth: []

tags:
  - name: cluster
    description: Whole-cluster state
  - name: nodes
    description: Cluster member nodes
  - name: resources
    description: Cluster resources (primitives, clones, groups)
  - name: actions-resource
    description: Runtime actions on resources
  - name: actions-node
    description: Runtime actions on nodes
  - name: config
    description: Configuration-level reads and writes that change CIB definitions

paths:
  /api/mcp/v1/cluster:
    get:
      operationId: cluster_get
      tags: [cluster]
      summary: Get a one-call summary of the cluster
      description: |
        Returns the cluster name, health status and summary line, the current
        designated controller (DC), quorum state, CIB epoch, fencing state and
        counts of nodes and resources, plus the names of any failed resources,
        offline nodes, unclean nodes and nodes in maintenance mode (each of those
        four lists is omitted when empty).

        Use this first when you need to know whether the cluster is healthy.
        A resource listed in failed_resources needs attention even if the
        cluster as a whole is quorate.

        If something failed or moved, call history_report_get (kind=log or
        kind=events) for the cluster log, and resource_history_get for one
        resource's operation records.

        The epoch is formatted as admin_epoch:epoch:num_updates (for example 1:42:7); config_snapshot_get reports the bare epoch number.
      responses:
        '200':
          description: Cluster summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/crm/status:
    get:
      operationId: crm_status_get
      tags: [cluster]
      summary: Get the parsed output of `crm status`
      description: |
        Returns every cluster node and every resource instance as reported by
        crm_mon: per node whether it is online, in standby, in maintenance,
        unclean or pending, whether it is the DC and how many resources it
        runs; per resource its class, provider, type, canonical agent name
        (class[:provider]:type), role, target role, whether it is active,
        managed, failed, orphaned, blocked, on which nodes it runs, and which
        clone it belongs to (if any).

        Use this to inspect a specific node or resource in detail. For a quick
        health check prefer cluster_get, whose output is much smaller.

        If a node or resource has failed, follow up with history_report_get
        (kind=log or kind=events) and resource_history_get for that resource.

        Node attributes and utilization are only returned by nodes_list; this tool reports liveness and resource state.
      responses:
        '200':
          description: Live node and resource state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/nodes:
    get:
      operationId: nodes_list
      tags: [nodes]
      summary: List cluster nodes with their attributes
      description: |
        Returns every configured cluster node merged with its live state:
        name, id, online/standby/maintenance/unclean/pending flags, whether it
        is the DC, how many resources it currently runs, its node type
        (member or remote), plus the node attributes and utilization values
        stored in the CIB.

        Use this when you need node attributes (for example to check node
        labels or capacity values) rather than just liveness.

        Nodes that crm_mon reports but the CIB does not configure are appended as
        well.
      responses:
        '200':
          description: Node list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/resources:
    get:
      operationId: resources_list
      tags: [resources]
      summary: List cluster resources with parameters and live state
      description: |
        Returns every resource configured in the CIB merged with its live
        state: id, resource agent class/provider/type, the agent name, current
        role and target role, the node it runs on, managed/maintenance/failed/
        orphaned/blocked flags, how many nodes it runs on and which ones, the
        clone it belongs to (omitted for non-clone members), and the instance
        parameters and meta attributes stored in the CIB. The group field is
        set when the resource is a member of a group, and operations lists the
        configured operations when the resource has any.

        Use this to inspect resource configuration and parameters. Note that
        the derived flags (orphaned, blocked, failure_ignored) are omitted when
        false, while active/managed/maintenance/failed are always present, and
        that parameters appear as a flat name/value object.
      responses:
        '200':
          description: Resource list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/resources/{id}/start:
    post:
      operationId: resource_start
      tags: [actions-resource]
      summary: Start a resource
      description: |
        Asks pacemaker to start the resource (`crm --force resource start <id>`).
        Starting an already started resource is effectively a no-op.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (role/active/node of the resource).
      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/resources/{id}/stop:
    post:
      operationId: resource_stop
      tags: [actions-resource]
      summary: Stop a resource
      description: |
        Asks pacemaker to stop the resource (`crm --force resource stop <id>`).
        Stopping a fencing resource disables fencing while it is stopped.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        State the intent to the user before calling it.
        The node itself is not touched.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (role/active of the resource).
      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/resources/{id}/cleanup:
    post:
      operationId: resource_cleanup
      tags: [actions-resource]
      summary: Clear a resource's failure history (not its placement constraint; see resource_clear)
      description: |
        Failcount: clears the failure history (failcount) of the resource (`crm --force
        cleanup <id> [<node>]`); it does not clear a placement constraint (use
        resource_clear for that). Useful after fixing the cause of a failed resource:
        it drops the failcount and allows the resource to run on a node again. It does
        not start or stop anything.

        Set the optional "destination" to clear the failcount on one node only; omit
        it to clear it on all nodes.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (failed flag of the resource).
      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptionsWithDestination'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/resources/{id}/clear:
    post:
      operationId: resource_clear
      tags: [actions-resource]
      summary: Clear the placement constraint left by a move/migrate (not the failure history; see resource_cleanup)
      description: |
        Placement: removes transient placement constraints, for example one left behind
        earlier `crm resource move` (`crm --force resource clear <id>`), so the scheduler
        is free to place the resource again; it does not touch the failure history (use
        resource_cleanup for that).

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (node of the resource).
      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/resources/{id}/maintenance-on:
    post:
      operationId: resource_maintenance_on
      tags: [actions-resource]
      summary: Put a resource into maintenance mode
      description: |
        Puts the resource into maintenance mode (`crm --force resource maintenance <id>`):
        pacemaker stops managing it, so no recovery action is taken if it fails.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        This does not start or stop the resource. State the intent to the user
        before calling it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (maintenance flag of the resource).
      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/resources/{id}/maintenance-off:
    post:
      operationId: resource_maintenance_off
      tags: [actions-resource]
      summary: Remove a resource from maintenance mode
      description: |
        Takes the resource out of maintenance mode (`crm --force resource maintenance <id> off`),
        returning it to management by pacemaker.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (maintenance flag of the resource).
      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/resources/{id}/migrate:
    post:
      operationId: resource_migrate
      tags: [actions-resource]
      summary: Move a resource to a specific node
      description: |
        Moves the resource to the node given in "destination"
        (`crm --force resource migrate <id> <destination>`). This creates a placement
        constraint, so the resource stays on that node until the constraint is cleared
        with resource_clear.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (node of the resource).
      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptionsMigrate'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/resources/{id}/delete:
    post:
      operationId: resource_delete
      tags: [actions-resource]
      summary: Delete a CIB configuration object (primitive, group, clone or constraint)
      description: |
        Deletes a configuration object from the CIB by id (`crm --force configure delete <id>`):
        a primitive, a group, a clone or a constraint. A running primitive is stopped as
        part of the removal; there is no undo.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        State the intent to the user before calling it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (resource no longer present in resources_list).

        Deleting a group or clone removes only the container; its member resources stay configured.

      parameters:
        - name: id
          in: path
          required: true
          description: resource id
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/nodes/{name}/standby-on:
    post:
      operationId: node_standby_on
      tags: [actions-node]
      summary: Put a node into standby
      description: |
        Puts the node into standby (`crm --force node standby <name>`): pacemaker moves
        its resources away and does not schedule new ones on it. The node keeps running.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        Workloads may move or briefly stop. State the intent to the user before
        calling it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (standby flag and resources_running of the node).

        The node stays in standby until node_standby_off is called.
      parameters:
        - name: name
          in: path
          required: true
          description: node name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/nodes/{name}/standby-off:
    post:
      operationId: node_standby_off
      tags: [actions-node]
      summary: Take a node out of standby
      description: |
        Brings the node back online (`crm --force node online <name>`), so pacemaker may
        schedule resources on it again.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (standby flag of the node).
      parameters:
        - name: name
          in: path
          required: true
          description: node name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/nodes/{name}/maintenance-on:
    post:
      operationId: node_maintenance_on
      tags: [actions-node]
      summary: Put a node into maintenance mode
      description: |
        Puts the node into maintenance mode (`crm --force node maintenance <name>`):
        resources on it are frozen in place and not recovered if they fail.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        This does not start, stop or restart anything. State the intent to the
        user before calling it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (maintenance flag of the node).
      parameters:
        - name: name
          in: path
          required: true
          description: node name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/nodes/{name}/maintenance-off:
    post:
      operationId: node_maintenance_off
      tags: [actions-node]
      summary: Remove a node from maintenance mode
      description: |
        Takes the node out of maintenance mode (`crm --force node ready <name>`), so
        pacemaker recovers and schedules resources on it again.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (maintenance flag of the node).
      parameters:
        - name: name
          in: path
          required: true
          description: node name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/nodes/{name}/fence:
    post:
      operationId: node_fence
      tags: [actions-node]
      summary: Fence (power cycle) a node
      description: |
        Fences the node (`crm --force node fence <name>`), i.e. asks the fencing device
        to power it off and back on. Every resource on that node is terminated. Use it only
        when the node is unreachable or must be reset; it is the most disruptive action
        this API offers.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        State the intent to the user before calling it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (online flag of the node afterwards).
      parameters:
        - name: name
          in: path
          required: true
          description: node name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'

  /api/mcp/v1/nodes/{name}/clearstate:
    post:
      operationId: node_clearstate
      tags: [actions-node]
      summary: Clear a node's UNCLEAN state
      description: |
        Clears the node state (`crm --force node clearstate <name>`), for example a
        stale UNCLEAN flag after a fence or a network failure, so that the node can
        rejoin cleanly.

        Requires {"confirm": true} in the request body. Add {"dry_run": true} to preview the
        exact crm command without running it.

        After calling it, re-read the state with resources_list or crm_status_get
        to confirm the effect (unclean flag of the node).
      parameters:
        - name: name
          in: path
          required: true
          description: node name
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteOptions'
      responses:
        '200':
          description: Command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ConfirmationRequired'
        '500':
          $ref: '#/components/responses/CommandFailed'
  /api/mcp/v1/resource-definitions:
    post:
      operationId: resource_create
      tags: [config]
      summary: Create a primitive resource definition
      description: |
        Creates a new primitive: `crm configure primitive <id>
        <class>[:<provider>]:<type> [k=v ...] [meta k=v ...]`. This tool is
        create-only: an existing id answers 409 already_exists and nothing changes.
        To change a resource use resource_parameter_set, one parameter at a time
        (set "delete": true to delete one); that keeps its history and placement.

        Identifiers are validated before anything runs, values must not contain
        double quotes or line breaks, and an unknown agent is rejected with 400
        before the CIB is modified.

        Requires {"confirm": true}. Add {"dry_run": true} to get the exact command
        without changing the CIB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDefinition'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/resource-parameters:
    post:
      operationId: resource_parameter_set
      tags: [config]
      summary: Set or delete one instance parameter or meta attribute
      description: |
        Changes exactly one instance parameter (meta=false, the default) of an
        existing primitive, or one meta attribute (meta=true) of an existing
        primitive, group or clone:

          crm resource param <id> set    <name> <value>
          crm resource param <id> delete <name>
          crm resource meta  <id> set    <name> <value>
          crm resource meta  <id> delete <name>

        This is the supported way to change an existing resource: unlike re-creating it,
        it keeps the resource history and its current placement. A parameter that is
        exported as a node attribute or utilization can cause a restart or a move, so
        re-read resources_list afterwards. Deleting a parameter that is not set is not
        an error; the response reports updated=false and says there was nothing to do.

        Requires {"confirm": true}; add {"dry_run": true} to preview the command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceParameter'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/node-attributes:
    post:
      operationId: node_attribute_set
      tags: [config]
      summary: Set a permanent node attribute
      description: |
        Sets a node attribute in the CIB (`crm node attribute <node> set <name> <value>`).
        Node attributes are used by location rules and resource rules, so setting one
        can cause resources to move. The response reports whether the attribute was
        created or updated.

        The node must be a cluster member (404 otherwise) and the name must match a
        conservative pattern. Requires {"confirm": true}; add {"dry_run": true} to
        preview the command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeAttributeSet'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/node-attributes/delete:
    post:
      operationId: node_attribute_delete
      tags: [config]
      summary: Delete a permanent node attribute
      description: |
        Removes a node attribute from the CIB (`crm node attribute <node> delete <name>`).
        Deleting an attribute that is not set is not an error: the response reports
        updated=false and explains that there was nothing to delete. Location rules that
        reference the attribute can become unsatisfiable, which may block resources, so
        review the rules before deleting an attribute you did not create.

        Requires {"confirm": true}; add {"dry_run": true} to preview the command.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeAttributeDeleteRequest'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
  /api/mcp/v1/resource-groups:
    get:
      operationId: resource_groups_list
      tags: [config]
      summary: List resource groups
      description: |
        Returns every resource group with its ordered member list and meta
        attributes. A group that is wrapped by a clone reports that clone in
        "clone". Use it after resource_group_create or the member tools to
        verify the result, and before deleting a group.
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
    post:
      operationId: resource_group_create
      tags: [config]
      summary: Create a resource group
      description: |
        Creates a group with the given ordered members
        (`crm configure group <id> <member> ... [meta k=v ...]`).

        Groups are create-only: crmsh refuses to create an id that already
        exists, so an existing id is answered with 409 already_exists and
        nothing changes. Change membership with resource_group_member_add and
        resource_group_member_remove, and meta attributes through
        resource_parameter_set with meta=true.

        Every member must be a configured primitive that is not already inside
        another group or clone, and the member order is the start order.

        Requires {"confirm": true}; add {"dry_run": true} to preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceGroupCreate'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/resource-group-members/add:
    post:
      operationId: resource_group_member_add
      tags: [config]
      summary: Add a resource to an existing group
      description: |
        Adds one primitive to a group (`crm configure modgroup <group> add <resource>`).
        This is the supported way to change group membership; re-creating the group
        is refused by crmsh.

        The resource must exist and must not be inside another group or clone
        (409 already_contained otherwise), and the group must exist (404).

        Requires {"confirm": true}; add {"dry_run": true} to preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceGroupMember'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/resource-group-members/remove:
    post:
      operationId: resource_group_member_remove
      tags: [config]
      summary: Remove a resource from an existing group
      description: |
        Removes one primitive from a group
        (`crm configure modgroup <group> remove <resource>`). The primitive stays
        configured; it just becomes a top-level resource again. Removing a resource
        that is not a member of the group is answered with 409 not_a_member, and
        removing the last member is rejected with 400 - a group needs at least one
        member, so delete the group instead.

        Requires {"confirm": true}; add {"dry_run": true} to preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceGroupMember'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/resource-clones:
    get:
      operationId: resource_clones_list
      tags: [config]
      summary: List clones
      description: |
        Returns every clone with the resource (or group) it wraps and its meta
        attributes. Clones are also visible on the wrapped resources through the
        "clone" field of resources_list.
      responses:
        '200':
          description: Clone list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloneList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
    post:
      operationId: resource_clone_create
      tags: [config]
      summary: Create a clone around a resource or group
      description: |
        Creates a clone (`crm configure clone <id> <resource|group> [meta k=v ...]`).

        Clones are create-only: an existing id is answered with 409 already_exists.
        The child cannot be changed in place; delete the clone with resource_delete
        and create it again if you need a different child. Deleting a clone keeps
        the child resource.

        The child must exist and must not already be inside another group or clone.

        Requires {"confirm": true}; add {"dry_run": true} to preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCloneCreate'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/resource-constraints:
    get:
      operationId: resource_constraints_list
      tags: [config]
      summary: List location, colocation, order and ticket constraints
      description: |
        Returns every constraint with its type and attributes. Location constraints
        report resource, node and score; colocation constraints report resource,
        with_resource and score; order constraints report first, then, their
        actions and the kind; ticket constraints report resource, ticket,
        loss_policy and role. Use it to verify constraint creation and to see what
        has to be removed before moving resources.
      responses:
        '200':
          description: Constraint list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstraintList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
    post:
      operationId: resource_constraint_create
      tags: [config]
      summary: Create a location, colocation, order or rsc_ticket constraint
      description: |
        Creates one constraint:

          location    crm configure location <id> <resource> <score>: <node>
          colocation  crm configure colocation <id> <score>: <resource> <with_resource>
          order       crm configure order <id> [<kind>:] <first> <then>
          rsc_ticket  crm configure rsc_ticket <id> <ticket>: <resource>[:<role>] [loss-policy=<loss-policy>]

        "type" selects the form and the required fields follow from it: location
        needs resource and node, colocation needs resource and with_resource, order
        needs first and then, rsc_ticket needs resource and ticket. "kind" is only used by order and must be Mandatory,
        Optional or Serialize (default Mandatory). "score" defaults to 100 when omitted; an explicit 0 is passed through unchanged (for location, 0 means no preference; a rule with score -inf forbids a node).

        Constraints are create-only: an existing id is answered with 409
        already_exists. A constraint target must be a top-level primitive, a group
        or a clone; a resource inside a group cannot carry a constraint directly
        because crmsh would treat it as ambiguous, so target the group instead.
        Location targets must be known cluster nodes.
        A location may carry a "rule" instead of node/score: a pacemaker condition
        with attribute expressions (#uname, #kind, node attributes), a recurring
        date_spec window (hours, weekdays, months, ...) or an absolute in_range
        window, combined by boolean_op (default or); when it matches it awards
        "score", or takes the score from score_attribute. Rules may nest up to
        three levels, are location-only, must not be combined with node/score, and
        are written through cibadmin because crmsh cannot express dates or nesting.
        A ticket constraint (type rsc_ticket, with "ticket" and optional "role" and
        "loss_policy") makes a resource depend on a cluster-wide ticket: the
        resource may only run while the ticket is granted to this site, and losing
        the ticket applies the loss policy (stop, demote, fence or freeze; the
        default is stop, or demote for promotable resources). Creating one against
        a ticket that is not granted therefore stops the resource - grant the ticket
        with crm_ticket first, or expect the resource to stop.

        Requires {"confirm": true}; add {"dry_run": true} to preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceConstraintCreate'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
  /api/mcp/v1/resource-operations:
    post:
      operationId: resource_operation_set
      tags: [config]
      summary: Set or delete one resource operation
      description: |
        Changes one operation of a primitive, for example a monitor interval:

          cibadmin --modify  --xpath //primitive[@id='<r>']                        --xml-text '<primitive ...><operations><op .../></operations></primitive>'
          cibadmin --replace --xpath //primitive[@id='<r>']/operations/op[@id='<id>'] --xml-text '<op .../>'
          cibadmin --delete  --xpath //primitive[@id='<r>']/operations/op[@id='<id>']

        Operations are edited through cibadmin because `crm configure op` is an
        alias for op_defaults and cannot touch one resource's operations. The
        operation id is <resource>-<name>-<interval>; a bare interval number means
        seconds ("10" and "10s" both become 10s). Setting an existing id replaces
        the whole operation, so omitted attributes are reset (there is no merge).
        "delete": true removes it, including the empty operations element when it
        was the last one; deleting a missing operation is not an error. Only
        primitives have operations; groups and clones inherit them from members.

        Requires {"confirm": true}; add {"dry_run": true} to preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceOperationSet'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'

  /api/mcp/v1/cluster-properties:
    get:
      operationId: cluster_properties_list
      tags: [config]
      summary: List cluster properties, resource defaults and operation defaults
      description: |
        Returns the three configuration property sets as flat name/value objects:

          cluster       crm_config   (stonith-enabled, no-quorum-policy, ...)
          rsc_defaults  rsc_defaults (resource-stickiness, migration-threshold, ...)
          op_defaults   op_defaults  (timeout, record-pending, ...)

        Use it to see which defaults are in effect before changing one, and to
        verify a write afterwards.
      responses:
        '200':
          description: Property sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterProperties'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
    post:
      operationId: cluster_property_set
      tags: [config]
      summary: Set or delete one cluster property or default
      description: |
        Sets one property with the corresponding crmsh command:

          crm configure property      <name>=<value>   scope cluster
          crm configure rsc_defaults  <name>=<value>   scope rsc_defaults
          crm configure op_defaults   <name>=<value>   scope op_defaults

        Deletion uses cibadmin, because crmsh rejects an empty value:

          cibadmin --delete --xpath //crm_config//nvpair[@name='<name>']      (scope cluster)
          cibadmin --delete --xpath //rsc_defaults//nvpair[@name='<name>']   (scope rsc_defaults)
          cibadmin --delete --xpath //op_defaults//nvpair[@name='<name>']    (scope op_defaults)

        Deleting a property that is not set is not an error (the response explains
        that there was nothing to delete). Some properties have consequences the
        API cannot check: setting stonith-enabled=false disables fencing, and
        disabling a node or a resource management property can stop recovery.

        Requires {"confirm": true}; add {"dry_run": true} to preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterPropertySet'
      responses:
        '200':
          description: Configuration result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/CommandFailed'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
  /api/mcp/v1/resource-history:
    get:
      operationId: resource_history_get
      tags: [resources]
      summary: Get the recorded operation history of one resource
      description: |
        Returns the operations pacemaker recorded for the resource, newest first,
        with the node, exit code, exit-code text, execution time and the time the
        status last changed. This is the structured data behind "why did this
        resource fail": a failed start or monitor shows up with a non-zero rc_code,
        and last_failure repeats the most recent such entry.

        Use it after a failure before deciding to clean up, restart or ignore the
        resource; rc_code 7 means the resource is not running, 2 means a parameter
        was rejected, and 124/125 mean a timeout; 190/191 mean degraded but
        still running. "limit" caps the number of
        entries (default 50; values above 500 are clamped).
      parameters:
        - name: resource
          in: query
          required: true
          description: resource id, for example stonith-sbd
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: maximum number of entries to return (default 50, maximum 500)
          schema:
            type: integer
      responses:
        '200':
          description: Operation history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ClusterUnavailable'
  /api/mcp/v1/history-report:
    get:
      operationId: history_report_get
      tags: [cluster]
      summary: Get a textual cluster history report from crmsh
      description: |
        Use this to investigate a failure: it returns a curated, cross-node
        report from `crm history <kind> [<object>]` - the log summary (kind log),
        resource and node events, the transition list, recorded events or the
        latest news. It is not a raw per-node journal; for raw journal lines read
        `journalctl -u pacemaker -u corosync` on the node itself. The structured
        per-resource counterpart is resource_history_get.

        `crm report` collects logs from every node, so a call takes about ten
        seconds and can be slower on a busy cluster; the tool gives up after two
        minutes. Output is stripped of ANSI colour codes,
        truncated to `limit` lines (default 200, maximum 2000) and capped at 512
        KiB; truncated=true tells you that the text was cut, and total_lines tells
        you how much there was.

        kind=resource and kind=node require "object" (resource id or node name);
        the other kinds take no object.
      parameters:
        - name: kind
          in: query
          required: true
          description: log, resource, node, transitions, events or latest
          schema:
            type: string
            enum: [log, resource, node, transitions, events, latest]
        - name: object
          in: query
          required: false
          description: resource id (kind=resource) or node name (kind=node)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: maximum number of lines to return (default 200, maximum 2000)
          schema:
            type: integer
      responses:
        '200':
          description: History report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/CommandFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Static token read by hawk-apiserver from /etc/hawk/mcp.token. Send it as
        "Authorization: Bearer <token>".

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ClusterUnavailable:
      description: |
        The cluster is stopped, still initializing, or pacemaker does not
        report any cluster member.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    BadRequest:
      description: The request body or path is invalid, for example a migrate without a destination
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConfirmationRequired:
      description: 'The request would change cluster state but did not carry {"confirm": true}'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CommandFailed:
      description: The underlying crm command failed; the payload carries the command line and stderr
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The referenced node or resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The request needs confirmation, or the object already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: The crm history command did not finish within the timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      description: Standard error payload
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine readable error code
              example: missing_token
            message:
              type: string
              description: Human readable explanation
            command:
              type: array
              description: Command line that failed (write actions only)
              items:
                type: string
            stderr:
              type: string
              description: Captured stderr of the failed command (write actions only)
    NameValue:
      type: object
      description: One name/value pair (node attribute, utilization entry or resource parameter)
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string

    ClusterSummary:
      type: object
      description: One-call cluster health summary
      required: [status, summary, node_count, nodes_online, resource_count]
      properties:
        cluster_name:
          type: string
          description: Value of the cluster-name CIB property (empty if unset)
        status:
          type: string
          description: One of online, noquorum, nofencing or unclean; a stopped or unreachable cluster answers 503 cluster_unavailable instead
        summary:
          type: string
          description: Human readable status line
        dc:
          type: string
          description: Name of the current designated controller
        have_quorum:
          type: string
          description: CIB have-quorum attribute ("1" or "0")
        epoch:
          type: string
          description: CIB epoch
        stack:
          type: string
          description: cluster-infrastructure property (for example corosync)
        version:
          type: string
          description: dc-version property
        fencing_enabled:
          type: string
          description: stonith-enabled property ("true" or "false")
        node_count:
          type: integer
          description: Number of nodes reported by crm_mon
        nodes_online:
          type: integer
          description: Number of nodes currently online
        resource_count:
          type: integer
          description: Number of resource instances (clone members included)
        failed_resources:
          type: array
          description: Resource ids currently marked failed
          items:
            type: string
        offline_nodes:
          type: array
          description: Node names currently offline
          items:
            type: string
        unclean_nodes:
          type: array
          description: Node names currently marked unclean
          items:
            type: string
        maintenance_nodes:
          type: array
          description: Node names currently in maintenance mode
          items:
            type: string

    Node:
      type: object
      description: Cluster node with live state and CIB attributes
      required: [name, id, online]
      properties:
        name:
          type: string
        id:
          type: string
        online:
          type: boolean
        standby:
          type: boolean
        maintenance:
          type: boolean
        unclean:
          type: boolean
        pending:
          type: boolean
        is_dc:
          type: boolean
        resources_running:
          type: integer
        type:
          type: string
          description: Node type as reported by pacemaker (member or remote)
        attributes:
          type: array
          description: Node attributes from the CIB (omitted when empty)
          items:
            $ref: '#/components/schemas/NameValue'
        utilization:
          type: array
          description: Node utilization values from the CIB (omitted when empty)
          items:
            $ref: '#/components/schemas/NameValue'

    NodeList:
      type: object
      required: [count]
      properties:
        items:
          type: array
          description: Nodes sorted by name
          items:
            $ref: '#/components/schemas/Node'
        count:
          type: integer

    Resource:
      type: object
      description: Resource configuration merged with live state
      required: [id, active, managed, maintenance, failed, nodes_running_on]
      properties:
        id:
          type: string
        class:
          type: string
          description: Resource agent class (ocf, stonith, systemd, ...)
        provider:
          type: string
          description: Resource agent provider, for example heartbeat
        type:
          type: string
          description: Resource agent type, for example IPaddr2
        agent:
          type: string
          description: canonical resource agent name, class[:provider]:type (for example ocf:heartbeat:Dummy)
        role:
          type: string
          description: Current role as reported by crm_mon (Started, Stopped, Master, Slave)
        target_role:
          type: string
          description: Target role, when one is configured
        node:
          type: string
          description: Node the resource currently runs on (first one for multi-node clones)
        active:
          type: boolean
        managed:
          type: boolean
        maintenance:
          type: boolean
        failed:
          type: boolean
        failure_ignored:
          type: boolean
        orphaned:
          type: boolean
        blocked:
          type: boolean
        nodes_running_on:
          type: integer
        running_on:
          type: array
          description: Names of nodes the resource currently runs on
          items:
            type: string
        clone:
          type: string
          description: Id of the clone this resource is a member of (omitted otherwise)
        group:
          type: string
          description: Id of the group this resource is a member of (omitted otherwise)
        params:
          type: object
          description: Instance parameters from the CIB as a flat name/value object
          additionalProperties:
            type: string
        meta:
          type: object
          description: Meta attributes from the CIB as a flat name/value object
          additionalProperties:
            type: string
        operations:
          type: array
          description: configured operations of the resource (omitted when there are none)
          items:
            $ref: '#/components/schemas/Operation'

    ResourceList:
      type: object
      required: [count]
      properties:
        items:
          type: array
          description: Resources sorted by id
          items:
            $ref: '#/components/schemas/Resource'
        count:
          type: integer

    CrmStatus:
      type: object
      description: Parsed `crm status` output
      required: [nodes, resources]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'

    WriteOptions:
      type: object
      description: |
        Request body of every write action. "confirm" is mandatory: without it the
        request is rejected with 409, so a mutation cannot happen by accident.
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true. Confirms that the caller intends to change cluster state.
        dry_run:
          type: boolean
          description: |
            When true, return the crm command that would run without executing it.
            Use it to check what an action would do before confirming it.
          default: false

    WriteOptionsWithDestination:
      type: object
      description: Request body of resource_cleanup; the target node is optional.
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true. Confirms that the caller intends to change cluster state.
        dry_run:
          type: boolean
          description: |
            When true, return the crm command that would run without executing it.
          default: false
        destination:
          type: string
          description: |
            Node to clean up on; omit to clean up on all nodes.

    WriteOptionsMigrate:
      type: object
      description: Request body of resource_migrate, which needs a target node.
      required: [confirm, destination]
      properties:
        confirm:
          type: boolean
          description: Must be true. Confirms that the caller intends to change cluster state.
        dry_run:
          type: boolean
          description: |
            When true, return the crm command that would run without executing it.
          default: false
        destination:
          type: string
          description: target node; required for resource_migrate.

    CommandResult:
      type: object
      description: Result of a write action
      required: [action, subject, command, executed]
      properties:
        action:
          type: string
          description: '<subject kind>_<action>, for example resource_start or node_standby_on'
        subject:
          type: string
          description: Resource id or node name the action was applied to
        command:
          type: array
          description: Exact argv that was (or, for a dry run, would be) executed
          items:
            type: string
        dry_run:
          type: boolean
        executed:
          type: boolean
          description: false for a dry run, true when the command actually ran
        message:
          type: string
        stdout:
          type: string
          description: Captured crm stdout, when non-empty
        stderr:
          type: string
          description: Captured crm stderr, when non-empty

    ResourceDefinition:
      type: object
      description: Primitive definition for resource_create
      required: [id, class, type, confirm]
      properties:
        id:
          type: string
          description: resource id (letters, digits, underscore, dot, dash; must not exist yet)
        class:
          type: string
          description: resource agent class, for example ocf
        provider:
          type: string
          description: resource agent provider, for example heartbeat; omit for classes without one
        type:
          type: string
          description: resource agent type, for example IPaddr2
        params:
          type: object
          description: instance parameters as a flat name/value object
          additionalProperties:
            type: string
        meta:
          type: object
          description: meta attributes as a flat name/value object; empty values are ignored
          additionalProperties:
            type: string
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    ResourceParameter:
      type: object
      description: One instance parameter or meta attribute of an existing resource
      required: [resource, name, confirm]
      properties:
        resource:
          type: string
          description: id of an existing resource
        name:
          type: string
          description: parameter or meta attribute name
        value:
          type: string
          description: value to set; ignored when delete is true, must not contain quotes or line breaks
        meta:
          type: boolean
          description: when true operate on a meta attribute instead of an instance parameter
          default: false
        delete:
          type: boolean
          description: when true delete the parameter instead of setting it
          default: false
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    NodeAttributeSet:
      type: object
      required: [node, name, value, confirm]
      properties:
        node:
          type: string
          description: cluster node name
        name:
          type: string
          description: attribute name
        value:
          type: string
          description: attribute value; must not contain double quotes or line breaks
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    NodeAttributeDeleteRequest:
      type: object
      required: [node, name, confirm]
      properties:
        node:
          type: string
          description: cluster node name
        name:
          type: string
          description: attribute name to delete
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    ConfigResult:
      type: object
      description: Result of a configuration write
      required: [action, object, subject, command, executed, created, updated, message]
      properties:
        action:
          type: string
          description: finer-grained operation id; it is not always a tool name
            (for example resource_meta_set and resource_operation_update are
            returned by resource_parameter_set and resource_operation_set)
        object:
          type: string
          description: the kind of the changed object (resource, resource_parameter,
            node_attribute, group, clone, constraint, resource_operation or
            cluster_property)
        subject:
          type: string
          description: affected id, or <resource>/<name>, <resource>/<name>@<interval>, <scope>/<name> or <node>/<name>
        command:
          type: array
          description: exact argv that was executed (for a dry run, would be executed); empty when nothing was run (a no-op delete)
          items:
            type: string
        dry_run:
          type: boolean
        executed:
          type: boolean
          description: true when the command actually ran
        created:
          type: boolean
          description: true when a new object, parameter or attribute was created
        updated:
          type: boolean
          description: true when an existing object, parameter or attribute was changed or removed
        message:
          type: string
        stdout:
          type: string
          description: captured crm stdout, when non-empty
        stderr:
          type: string
          description: captured crm stderr, when non-empty

    GroupInfo:
      type: object
      description: One resource group
      required: [id, members]
      properties:
        id:
          type: string
        members:
          type: array
          description: member primitives in start order
          items:
            type: string
        meta:
          type: object
          description: meta attributes of the group
          additionalProperties:
            type: string
        clone:
          type: string
          description: id of the clone that wraps this group, when there is one

    GroupList:
      type: object
      required: [count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupInfo'
        count:
          type: integer

    ResourceGroupCreate:
      type: object
      required: [id, members, confirm]
      properties:
        id:
          type: string
          description: group id; must not be used by any other object
        members:
          type: array
          description: primitive ids in start order; each must be a top-level primitive
          items:
            type: string
        meta:
          type: object
          description: optional meta attributes
          additionalProperties:
            type: string
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    ResourceGroupMember:
      type: object
      required: [group, resource, confirm]
      properties:
        group:
          type: string
          description: existing group id
        resource:
          type: string
          description: primitive id to add or remove
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    CloneInfo:
      type: object
      description: One clone
      required: [id]
      properties:
        id:
          type: string
        resource:
          type: string
          description: id of the wrapped primitive (or of the first primitive of the wrapped group)
        group:
          type: string
          description: id of the wrapped group, when the clone wraps a group
        meta:
          type: object
          description: meta attributes of the clone
          additionalProperties:
            type: string

    CloneList:
      type: object
      required: [count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CloneInfo'
        count:
          type: integer

    ResourceCloneCreate:
      type: object
      required: [id, resource, confirm]
      properties:
        id:
          type: string
          description: clone id; must not be used by any other object
        resource:
          type: string
          description: primitive or group id to wrap; must not be inside another container
        meta:
          type: object
          description: optional meta attributes, for example clone-max or clone-node-max
          additionalProperties:
            type: string
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    ConstraintInfo:
      type: object
      description: One constraint
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          description: location, colocation, order or rsc_ticket
        resource:
          type: string
          description: subject resource (location and colocation)
        node:
          type: string
          description: target node (location)
        with_resource:
          type: string
          description: second resource (colocation)
        score:
          type: string
          description: constraint score as reported by the CIB; a string, and it can be INFINITY for a -inf rule
        first:
          type: string
          description: first resource (order)
        first_action:
          type: string
          description: first action (order)
        then:
          type: string
          description: second resource (order)
        then_action:
          type: string
          description: second action (order)
        kind:
          type: string
          description: Mandatory, Optional or Serialize (order)
        ticket:
          type: string
          description: ticket id (rsc_ticket)
        loss_policy:
          type: string
          description: loss policy (rsc_ticket)
        role:
          type: string
          description: resource role the ticket dependency applies to (rsc_ticket)
        rule:
          $ref: '#/components/schemas/RuleInfo'

    ConstraintList:
      type: object
      required: [count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintInfo'
        count:
          type: integer

    ResourceConstraintCreate:
      type: object
      required: [id, type, confirm]
      properties:
        id:
          type: string
          description: constraint id; must not be used by any other object
        type:
          type: string
          description: location, colocation, order or rsc_ticket (ticket is accepted as an alias)
          enum: [location, colocation, order, rsc_ticket, ticket]
        resource:
          type: string
          description: subject resource; required for location and colocation
        node:
          type: string
          description: target node; required for location
        score:
          type: integer
          description: score, defaults to 100 when omitted; an explicit 0 is passed through unchanged; 0 means no preference (a rule with score -inf forbids a node). The constraint list returns scores as strings
        with_resource:
          type: string
          description: second resource; required for colocation
        first:
          type: string
          description: first resource; required for order
        then:
          type: string
          description: second resource; required for order
        kind:
          type: string
          description: order kind; Mandatory, Optional or Serialize (default Mandatory)
          enum: [Mandatory, Optional, Serialize]
        ticket:
          type: string
          description: ticket id the resource depends on (rsc_ticket only)
        loss_policy:
          type: string
          description: what happens when the ticket is lost (rsc_ticket only)
          enum: [stop, demote, fence, freeze]
        role:
          type: string
          description: resource role the dependency applies to (rsc_ticket only)
          enum: [Started, Stopped, Promoted, Unpromoted, Master, Slave]
        rule:
          $ref: '#/components/schemas/RuleSpec'
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the crm command without executing it
          default: false

    Operation:
      type: object
      description: One configured operation of a primitive
      required: [id, name]
      properties:
        id:
          type: string
          description: pacemaker operation id, <resource>-<name>-<interval>
        name:
          type: string
          description: operation name, for example monitor or start
        interval:
          type: string
          description: interval as stored in the CIB, for example 10s or 10000
        timeout:
          type: string
        on_fail:
          type: string
        role:
          type: string
        start_delay:
          type: string
        enabled:
          type: string
        description:
          type: string
        requires:
          type: string
        record_pending:
          type: string
        depth:
          type: string
        interval_origin:
          type: string

    ResourceOperationSet:
      type: object
      required: [resource, name, confirm]
      properties:
        resource:
          type: string
          description: id of an existing primitive
        name:
          type: string
          description: operation name, for example monitor, start, stop, promote
        interval:
          type: string
          description: interval; a bare number means seconds, default 0s
        timeout:
          type: string
        on_fail:
          type: string
          description: ignore, restart, restart-container, stop, fence, standby or block
        role:
          type: string
          description: Started, Stopped, Promoted, Unpromoted, Master or Slave
        start_delay:
          type: string
        enabled:
          type: string
        description:
          type: string
        requires:
          type: string
        record_pending:
          type: string
        delete:
          type: boolean
          description: when true delete the operation instead of setting it
          default: false
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the cibadmin command without executing it
          default: false

    ClusterProperties:
      type: object
      description: The three configuration property sets
      required: [cluster, rsc_defaults, op_defaults]
      properties:
        cluster:
          type: object
          description: crm_config properties
          additionalProperties:
            type: string
        rsc_defaults:
          type: object
          description: rsc_defaults properties
          additionalProperties:
            type: string
        op_defaults:
          type: object
          description: op_defaults properties
          additionalProperties:
            type: string

    ClusterPropertySet:
      type: object
      required: [name, confirm]
      properties:
        scope:
          type: string
          description: cluster (default), rsc_defaults or op_defaults
          enum: [cluster, rsc_defaults, op_defaults]
        name:
          type: string
          description: property name, for example stonith-enabled
        value:
          type: string
          description: value to set; ignored when delete is true
        delete:
          type: boolean
          description: when true delete the property instead of setting it
          default: false
        confirm:
          type: boolean
          description: must be true; without it the request is rejected with 409
        dry_run:
          type: boolean
          description: return the command without executing it
          default: false

    HistoryOp:
      type: object
      description: One recorded operation of a resource
      required: [node, operation, rc_code, rc_text, status]
      properties:
        node:
          type: string
          description: node the operation ran on
        operation:
          type: string
          description: operation name, for example start, stop or monitor
        interval:
          type: string
          description: interval as stored in the CIB, for example 10s or 10000
        rc_code:
          type: string
          description: exit code as recorded by pacemaker
        rc_text:
          type: string
          description: human readable meaning of rc_code, for example not running
        status:
          type: string
          description: ok (rc 0), not_running (rc 7, the normal answer for a probe on a node that must not run the resource) or failed
        op_status:
          type: string
          description: raw op-status attribute when present
        exec_time:
          type: string
          description: raw exec-time attribute in milliseconds, for example 3588
        last_rc_change:
          type: string
          description: epoch timestamp of the last status change
        last_run:
          type: string
          description: epoch timestamp of the last run
        call_id:
          type: string
        exit_reason:
          type: string
        operation_key:
          type: string

    ResourceHistory:
      type: object
      description: Operation history of one resource
      required: [resource, limit, count, ops]
      properties:
        resource:
          type: string
        limit:
          type: integer
        count:
          type: integer
        ops:
          type: array
          description: recorded operations, newest first
          items:
            $ref: '#/components/schemas/HistoryOp'
        last_failure:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HistoryOp'
          description: the most recent operation with status failed, or null when the resource has no failures recorded

    RuleSpec:
      type: object
      description: |
        A pacemaker rule attached to a location constraint. At least one of
        expressions, date_spec, in_range or rules is required, and the rule needs
        either score or score_attribute (not both). Rules nest up to three levels
        (RuleSpec -> RuleL2 -> RuleL3), which is how compound conditions are
        expressed.
      properties:
        score:
          description: score awarded when the rule matches; a number, or inf/-inf
          oneOf:
            - type: integer
            - type: string
        score_attribute:
          type: string
          description: take the score from this attribute instead of a fixed value
        rules:
          type: array
          description: nested rules (second level at most)
          items:
            $ref: '#/components/schemas/RuleL2'
        boolean_op:
          type: string
          description: how the expressions combine; `and` or `or` (defaults to `or` when there is more than one term)
          enum: [and, or]
        role:
          type: string
          description: only apply the rule to the resource in this role
          enum: [Started, Stopped, Promoted, Unpromoted]
        expressions:
          type: array
          description: attribute comparisons
          items:
            $ref: '#/components/schemas/RuleExpressionSpec'
        date_spec:
          $ref: '#/components/schemas/RuleDateSpec'
        in_range:
          $ref: '#/components/schemas/RuleInRange'

    RuleL2:
      type: object
      description: Nested rule (second level); same shape as RuleSpec with one nesting level left.
      properties:
        score:
          description: score awarded when the rule matches; a number, or inf/-inf
          oneOf:
            - type: integer
            - type: string
        score_attribute:
          type: string
        rules:
          type: array
          description: nested rules (third level)
          items:
            $ref: '#/components/schemas/RuleL3'
        boolean_op:
          type: string
          enum: [and, or]
        role:
          type: string
          enum: [Started, Stopped, Promoted, Unpromoted]
        expressions:
          type: array
          items:
            $ref: '#/components/schemas/RuleExpressionSpec'
        date_spec:
          $ref: '#/components/schemas/RuleDateSpec'
        in_range:
          $ref: '#/components/schemas/RuleInRange'

    RuleL3:
      type: object
      description: Deepest nested rule; it cannot nest further.
      properties:
        score:
          description: score awarded when the rule matches; a number, or inf/-inf
          oneOf:
            - type: integer
            - type: string
        score_attribute:
          type: string
        boolean_op:
          type: string
          enum: [and, or]
        role:
          type: string
          enum: [Started, Stopped, Promoted, Unpromoted]
        expressions:
          type: array
          items:
            $ref: '#/components/schemas/RuleExpressionSpec'
        date_spec:
          $ref: '#/components/schemas/RuleDateSpec'
        in_range:
          $ref: '#/components/schemas/RuleInRange'

    RuleExpressionSpec:
      type: object
      required: [attribute, operation]
      properties:
        attribute:
          type: string
          description: attribute name, for example #uname, #kind or a node attribute such as ping
        operation:
          type: string
          description: defined, not_defined, lt, gt, lte, gte, eq or ne
          enum: [defined, not_defined, lt, gt, lte, gte, eq, ne]
        value:
          type: string
          description: value to compare with; required unless operation is defined or not_defined

    RuleDateSpec:
      type: object
      description: |
        Recurring calendar window. At least one field must be set; each accepts a
        single value, a range such as 1-5, or a list such as 1,3,5.
      properties:
        years:
          type: string
        months:
          type: string
        monthdays:
          type: string
        hours:
          type: string
        minutes:
          type: string
        seconds:
          type: string
        yeardays:
          type: string
        weekyears:
          type: string
        weeks:
          type: string
        weekdays:
          type: string
        moon:
          type: string

    RuleInRange:
      type: object
      description: absolute time window; at least one of start and end
      properties:
        start:
          type: string
          description: for example 2026-01-01 or 2026-01-01 00:00:00
        end:
          type: string
          description: for example 2026-12-31 or 2026-12-31 23:59:59

    RuleInfo:
      type: object
      description: A rule as stored in the CIB
      properties:
        score:
          type: string
        score_attribute:
          type: string
        rules:
          type: array
          description: nested rules
          items:
            type: object
            additionalProperties: true
        boolean_op:
          type: string
        role:
          type: string
        expressions:
          type: array
          items:
            $ref: '#/components/schemas/RuleExpressionInfo'
        date_expressions:
          type: array
          items:
            $ref: '#/components/schemas/DateExpressionInfo'

    RuleExpressionInfo:
      type: object
      required: [attribute, operation]
      properties:
        attribute:
          type: string
        operation:
          type: string
        value:
          type: string

    DateExpressionInfo:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          description: date_spec, in_range, gt or lt
        start:
          type: string
        end:
          type: string
        date_spec:
          type: object
          additionalProperties:
            type: string

    HistoryReport:
      type: object
      description: Textual output of crm history
      required: [kind, command, exit_code, duration_seconds, total_lines, returned_lines, truncated, text]
      properties:
        kind:
          type: string
        object:
          type: string
        command:
          type: array
          description: exact argv that was executed
          items:
            type: string
        exit_code:
          type: integer
        duration_seconds:
          type: integer
        total_lines:
          type: integer
          description: number of lines the command produced before truncation
        returned_lines:
          type: integer
        truncated:
          type: boolean
        text:
          type: string
          description: ANSI-stripped output, truncated to limit lines and 512 KiB